[project]
name = "chartbook"
dynamic = ["version"]
description = "A tool for generating chart documentation websites"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
keywords = ["Dashboards", "Catalogs", "Data", "Analytics"]
authors = [
    { name = "Jeremiah Bejarano", email = "Jeremiah.Bejarano@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
# One install, everything included: CLI, data loading, plotting, and the
# Sphinx documentation toolchain. (A future release may split these into
# chartbook-data / chartbook-plot distributions that chartbook depends on;
# `pip install chartbook` will still mean "you get it all".)
dependencies = [
    # CLI framework + TOML support for config/manifest
    "click>=8.1.7",
    "tomli>=2.2.1",
    "tomli-w>=1.1.0",
    # Data loading
    "packaging",
    # DuckDB's lazy frames are built on polars' IO-plugin seam: DuckDB 1.5's
    # ask it for is_pure, which polars has from 1.33
    "polars>=1.33",
    "pyarrow",
    # The local SQL engine: [sources] with backend = "duckdb", and data.sql().
    # 1.4's lazy frames (.pl(lazy=True)) close their connection under polars 1.33 and later
    "duckdb>=1.5",
    "python-decouple>=3.8",
    # Plotting
    "matplotlib>=3.7.0",
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    "pluggy>=1.3.0",
    "fredapi>=0.5.0",
    "pandas-datareader>=0.10.0",
    # Sphinx ecosystem for documentation generation (build/publish commands)
    "ablog>=0.11.11",
    "Jinja2>=3.1.4",
    "linkify-it-py>=2.0.3",
    "markdown-it-py>=3.0.0",
    "myst-nb>=1.1.2",
    "myst-parser>=2.0.0",
    "pandas>=2.1.4",
    "pydata-sphinx-theme>=0.15.4",
    # Cap tracks the newest Sphinx major verified by the hatch-test sphinx
    # matrix below; raise it only after a green matrix run on the new major.
    "Sphinx>=7.2.6,<10",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx_design>=0.6.1",
    "sphinx_external_toc>=1.0.1",
    # Project scaffolding: chartbook init renders with cookiecutter (2.2
    # reads the template's __prompts__), and a project follows the template
    # with cruft
    "cookiecutter>=2.2",
    "cruft",
]

[project.optional-dependencies]
# `pip install chartbook` installs everything a pipeline on one machine needs,
# Sphinx included. The user-facing extras are a kind of store that needs a cloud
# library the base install does not bring, a warehouse's driver
# (docs_src/design/stores-and-backends.md) and a second site tool
# (docs_src/design/writer.md). The old
# [all], [data], [plotting] and [sphinx] aliases were removed after their one
# release of notice; see docs_src/reference/stability.md.
#
# The store in an S3 bucket: [store] url = "s3://bucket/prefix"
s3 = [
    "boto3>=1.28",
]
# A source in a Databricks SQL warehouse: [sources.x] backend = "databricks"
databricks = [
    "databricks-sql-connector[pyarrow]>=4.0",
]
# A site built with MkDocs instead of Sphinx: [project] writer = "mkdocs"
mkdocs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]

# The contributor toolchain is the `dev` dependency group below, which `uv sync`
# installs; it is not an extra, since it is nothing a user installs.
[dependency-groups]
dev = [
    # Build automation: `uv run doit` runs everything in dodo.py
    "doit>=0.36.0",
    "colorama",
    # Hatch runs the test matrix (`hatch test --all`, [tool.hatch.envs.hatch-test])
    # and is the build backend's own tool; `uv build` and `uv publish` do the release
    "hatch>=1.14",
    # The suite under `uv run pytest`: what [tool.hatch.envs.hatch-test] gives
    # each matrix environment, so the two agree (a test keeps them so)
    "pytest",
    "ipython",
    "jsonschema>=4.18",
    "jupytext>=1.16.0",
    "nbconvert>=7.0.0",
    "numpy",
    "openpyxl",
    "requests",
    "seaborn",
    "boto3>=1.28",
    "moto[s3]>=5",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]

[project.scripts]
chartbook = "chartbook.cli:main"

# A kind of store, found by the scheme of the store's URL (chartbook.store.store_for_url)
[project.entry-points."chartbook.stores"]
s3 = "chartbook.stores.s3:S3Store"

[project.entry-points."chartbook.backends"]
databricks = "chartbook.backends.databricks:DatabricksBackend"

[project.urls]
Documentation = "https://backofficedev.github.io/chartbook"
Issues = "https://github.com/backofficedev/chartbook/issues"
Source = "https://github.com/backofficedev/chartbook"

[tool.hatch.version]
path = "src/chartbook/__about__.py"

[tool.coverage.run]
source_pkgs = ["chartbook", "tests"]
branch = true
parallel = true
data_file = ".coverage"
omit = ["src/chartbook/__about__.py"]

[tool.coverage.paths]
chartbook = ["src/chartbook", "*/chartbook/src/chartbook"]
tests = ["tests", "*/chartbook/tests"]

[build-system]
# license-files as a list (PEP 639, above) is read from hatchling 1.27 on
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel alone collapses src/: `packages` there ships src/chartbook as
# chartbook. Set for every target (as it was, with a `sources` remapping),
# it made the sdist strip src/ too, and a wheel built from that sdist, whose
# pyproject still points at src/chartbook, had no code in it.
[tool.hatch.build.targets.wheel]
packages = ["src/chartbook"]

# The sdist keeps the source layout, so that a wheel built from it is the
# wheel built from the checkout: src/chartbook here; pyproject.toml, the
# README, the licence and hatch_build.py come with every sdist; template/
# and src/chartbook/built_from.txt are put in by hatch_build.py.
[tool.hatch.build.targets.sdist]
include = ["/src/chartbook"]

# hatch_build.py: the project template `chartbook init` renders comes with
# the package, so the two always match (chartbook.scaffold.find_template):
# the files git tracks in template/, as chartbook/template in the wheel and
# template/ in the sdist. And the commit it is at, in
# chartbook/built_from.txt, for the .cruft.json `chartbook init` writes. Not
# a force-include here, which would ship whatever is in template/, ignored
# files too, and copy it into site-packages for an editable install.
[tool.hatch.build.hooks.custom]

[tool.hatch.envs.hatch-test]
# Use dev-mode to install local chartbook from src/ (base deps now include
# the full data/plotting/sphinx stack)
dev-mode = true
extra-dependencies = [
    # Dependencies for running example project integration tests
    "colorama",
    "doit>=0.36.0",
    "ipython",
    # Validates generated index records against the published JSON Schemas
    "jsonschema>=4.18",
    "jupytext",
    "nbconvert",
    "numpy",
    "openpyxl",
    "requests",
    "seaborn",
    # The S3 store, against a mocked bucket
    "boto3>=1.28",
    "moto[s3]>=5",
    # The MkDocs writer's build test
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

# Sphinx-version coverage. The python matrix above already spreads the upper
# range at resolver level (3.10 -> Sphinx 8.1, 3.11 -> 8.2, 3.12/3.13 -> 9.x);
# these envs pin the 7.x floor era and the 8.2 stack explicitly so every
# supported Sphinx major stays tested as new majors ship.
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.13"]
sphinx = ["sphinx7", "sphinx8"]

[tool.hatch.envs.hatch-test.overrides]
matrix.sphinx.extra-dependencies = [
    { value = "sphinx~=7.4", if = ["sphinx7"] },
    { value = "sphinx~=8.2", if = ["sphinx8"] },
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::Warning"]
# A passing test's tmp_path is removed when it ends, a failing one's kept to
# look at: kept whole, the suite's sites and stores filled CI's disk
tmp_path_retention_policy = "failed"
markers = [
    "integration: needs tools that may not be installed (LaTeX); each such test skips itself when they are missing",
]
addopts = "--doctest-modules --ignore=examples"
pythonpath = ["."]
testpaths = ["tests"]
