[project]
requires_chartbook = ">=0.2.0"
name = "Yield Curve"
description = "Analyze yield curve"
contributors = [
    "Jeremy Bejarano",
]
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]

# Named commands. `chartbook run` runs `build`.
[scripts]
build = "doit"

[notebooks.01_example_notebook_interactive]
description = "Example notebook for demonstrating how to construct a Chartbook notebook."
path = "_output/01_example_notebook_interactive_ipynb.ipynb"

[notebooks.02_example_with_dependencies]
description = "Example notebook demonstrating dependencies on data pulls."
path = "_output/02_example_with_dependencies_ipynb.ipynb"

[notebooks.03_public_repo_summary_charts]
description = "Summary charts using public repo data."
path = "_output/03_public_repo_summary_charts_ipynb.ipynb"

[notebooks.04_term_premium_charts]
description = "Analysis of term premium measures from the yield curve."
path = "_output/04_term_premium_charts_ipynb.ipynb"

[dataframes.repo_public]
name = "Public Repo Data"
description = "Public repo series and related economic and financial aggregates."
sources = [
    "FRED",
    "Office of Financial Research",
]
providers = [
    "FRED",
    "Office of Financial Research",
]
provider_links = [
    "https://fred.stlouisfed.org/",
    "https://www.financialresearch.gov/short-term-funding-monitor/api/",
]
tags = [
    "Short Term Funding",
    "Repo",
]
pull_method = "Web API via Python"
path = "./_data/repo_public.parquet"
date_col = "date"
docs_path = "./docs_src/dataframes/repo_public.md"

[dataframes.fed_yield_curve]
name = "Fed Yield Curve"
description = "Zero-coupon Treasury yield curve from the Federal Reserve."
sources = [
    "Federal Reserve Board",
]
providers = [
    "Federal Reserve Board",
]
provider_links = [
    "https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv",
]
tags = [
    "Yield Curve",
    "Treasury",
]
pull_method = "Web API via Python"
path = "./_data/fed_yield_curve.parquet"
date_col = "Date"
docs_path = "./docs_src/dataframes/fed_yield_curve.md"

# Where a dataframe may live besides a file. `yield_slopes` below is a query
# that DuckDB runs over a table the pipeline builds (src/build_duckdb.py).
[sources.local]
backend = "duckdb"
url = "duckdb:///./_data/yield_curve.duckdb"

[dataframes.yield_slopes]
name = "Yield Curve Slopes"
description = "Slopes of the zero-coupon yield curve: the 10-year yield less the 1-, 2- and 3-year yields, as a query over the Fed yield curve."
sources = [
    "Federal Reserve Board",
]
providers = [
    "Federal Reserve Board",
]
provider_links = [
    "https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv",
]
tags = [
    "Yield Curve",
]
pull_method = "A SQL query over the fed_yield_curve table, run by DuckDB when the dataframe is read"
source = "local"
query = "select Date, SVENY10 - SVENY01 as slope_10y_1y, SVENY10 - SVENY02 as slope_10y_2y, SVENY10 - SVENY03 as slope_10y_3y from fed_yield_curve order by Date"
date_col = "Date"
docs_path = "./docs_src/dataframes/yield_slopes.md"

[dataframes.term_premium]
name = "Term Premium"
description = "Term premium measures derived from the yield curve."
sources = [
    "Federal Reserve Board",
]
providers = [
    "Federal Reserve Board",
]
provider_links = [
    "https://www.federalreserve.gov/data/yield-curve-tables/feds200628.csv",
]
tags = [
    "Yield Curve",
    "Term Premium",
]
pull_method = "Derived from Fed yield curve data"
path = "./_data/term_premium.parquet"
date_col = "date"
docs_path = "./docs_src/dataframes/term_premium.md"

[dataframes.term_premium.series.spread_10y_1y]
name = "10Y-1Y Spread"
description = "10-year zero-coupon yield minus the 1-year yield."
units = "Percentage points"
frequency = "Daily"

[dataframes.term_premium.series.spread_10y_2y]
name = "10Y-2Y Spread"
description = "10-year zero-coupon yield minus the 2-year yield."
units = "Percentage points"
frequency = "Daily"

[dataframes.term_premium.series.spread_10y_3y]
name = "10Y-3Y Spread"
description = "10-year zero-coupon yield minus the 3-year yield."
units = "Percentage points"
frequency = "Daily"

[models.term_premium_ar1]
name = "Term Premium AR(1)"
description = "Predicts tomorrow's 10-year minus 2-year spread from today's."
path = "./_models/term_premium_ar1.json"
trained_on = [
    "term_premium",
]
metrics_path = "./_output/term_premium_ar1_metrics.json"
docs_path = "./docs_src/models/term_premium_ar1.md"
tags = [
    "Yield Curve",
    "Forecast",
]

[charts.repo_rates]
name = "Repo Rates"
description = "SOFR, the Effective Funds Rate, and the Fed's Target Range"
dataframe = "repo_public"
tags = [
    "Short Term Funding",
    "Repo",
]
frequency = "Daily"
observation_period = "Weekday"
release_lag = "One day"
release_timing = "Weekday"
units = "Percent"
path = "./_output/repo_rates.html"
docs_path = "./docs_src/charts/repo_rates.md"

[charts.yield_curve_current]
name = "Current Yield Curve"
description = "Most recent U.S. Treasury zero-coupon yield curve"
dataframe = "fed_yield_curve"
tags = [
    "Yield Curve",
    "Treasury",
]
frequency = "Daily"
observation_period = "Weekday"
release_lag = "One day"
release_timing = "Weekday"
units = "Percent"
path = "./_output/yield_curve_current.html"
docs_path = "./docs_src/charts/yield_curve_current.md"

[charts.term_premium_10y_1y]
name = "Term Premium (10Y-1Y)"
description = "10-year minus 1-year Treasury yield spread over time"
dataframe = "term_premium"
tags = [
    "Yield Curve",
    "Term Premium",
]
frequency = "Daily"
observation_period = "Weekday"
release_lag = "One day"
release_timing = "Weekday"
units = "Percentage Points"
path = "./_output/term_premium_10y_1y.html"
docs_path = "./docs_src/charts/term_premium.md"

[charts.term_premium_10y_2y]
name = "Term Premium (10Y-2Y)"
description = "10-year minus 2-year Treasury yield spread over time"
dataframe = "term_premium"
tags = [
    "Yield Curve",
    "Term Premium",
]
frequency = "Daily"
observation_period = "Weekday"
release_lag = "One day"
release_timing = "Weekday"
units = "Percentage Points"
path = "./_output/term_premium_10y_2y.html"
docs_path = "./docs_src/charts/term_premium.md"

[charts.term_premium_10y_3y]
name = "Term Premium (10Y-3Y)"
description = "10-year minus 3-year Treasury yield spread over time"
dataframe = "term_premium"
tags = [
    "Yield Curve",
    "Term Premium",
]
frequency = "Daily"
observation_period = "Weekday"
release_lag = "One day"
release_timing = "Weekday"
units = "Percentage Points"
path = "./_output/term_premium_10y_3y.html"
docs_path = "./docs_src/charts/term_premium.md"
