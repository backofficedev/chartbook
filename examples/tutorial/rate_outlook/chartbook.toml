[project]
id = "tutorial/rate_outlook"
name = "Rate Outlook"
description = "The term spread and a small model of it, built on two other pipelines' data, pinned."
maintainer = "The ChartBook tutorial"
requires_chartbook = ">=0.5.0"

[scripts]
build = "doit"

# The pipelines this one builds on, by their IDs. `chartbook pin` freezes the snapshot of each
# that this pipeline reads, in chartbook.lock; `chartbook update` moves the pins.
[dependencies]
"tutorial/treasury_curve" = {}
"tutorial/macro_basics" = {}

[dataframes.term_spread]
name = "Term Spread and Unemployment"
description = "The 10-year less the 2-year Treasury yield, monthly, beside the unemployment rate."
sources = ["Federal Reserve Board", "Bureau of Labor Statistics"]
providers = ["The tutorial's treasury_curve and macro_basics pipelines"]
tags = ["Treasuries", "Macro"]
license = "Public domain: works of the U.S. government"
pull_method = "Derived from two pinned pipelines"
path = "./_data/term_spread.parquet"
date_col = "date"
docs = """
Built by `src/build_spread.py` from `treasury_curve:zero_coupon_yields` (month-end 2- and 10-year
yields) and `macro_basics:macro_series` (the unemployment rate), each read as `chartbook.lock` pins
it. `spread` is the 10-year less the 2-year, in percentage points.
"""

[models.spread_ar1]
name = "Term Spread AR(1)"
description = "Next month's term spread from this month's, by a straight line."
path = "./_models/spread_ar1.json"
trained_on = ["treasury_curve:zero_coupon_yields"]
metrics_path = "./_output/spread_ar1_metrics.json"
tags = ["Treasuries"]
docs = """
`spread[t+1] = intercept + slope * spread[t]`, fitted with NumPy on the first 80% of months and
scored on the rest. An example of the mechanics, not a forecast to act on: the point is that its page
says exactly which bytes of the yield curve it was trained on.
"""

[charts.term_spread]
name = "The Term Spread and Unemployment"
description = "The 10-year less the 2-year yield, and the unemployment rate"
dataframe = "term_spread"
tags = ["Treasuries", "Macro"]
frequency = "Monthly"
observation_period = "Month"
release_lag = "As its two inputs'"
release_timing = "When either input is updated"
units = "Percent"
path = "./_output/term_spread.html"
docs = "An inverted curve (a spread below zero) has come before every U.S. recession since the 1970s."
