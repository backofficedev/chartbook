[project]
name = "Example Charts from FRED"
description = "Example Charts from FRED"
contributors = [
    "backofficedev",
]
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "macOS",
]
build = "doit"

[notebooks.01_example_notebook_interactive]
description = "Interactive Plotly chart showing US GDP over time."
path = "_output/01_example_notebook_interactive_ipynb.ipynb"

[notebooks.02_example_with_dependencies]
description = "Interactive Plotly chart showing US unemployment rate over time."
path = "_output/02_example_with_dependencies_ipynb.ipynb"

[dataframes.fred]
name = "FRED Economic Data"
description = "Basic economic time series from FRED including GDP, Unemployment Rate, CPI, and Federal Funds Rate."
sources = [
    "FRED",
]
providers = [
    "Federal Reserve Bank of St. Louis",
]
provider_links = [
    "https://fred.stlouisfed.org/",
]
tags = [
    "Macroeconomic",
    "GDP",
    "Unemployment",
]
pull_method = "Web API via Python"
path = "./_data/fred.parquet"
date_col = "date"
docs_path = "./docs_src/dataframes/fred.md"

[charts.gdp_chart]
name = "GDP Over Time"
description = "Interactive line chart showing US Gross Domestic Product over time."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "GDP",
]
frequency = "Quarterly"
observation_period = "Quarter"
release_lag = "One month"
release_timing = "Quarterly"
units = "Billions of Dollars"
path = "./_output/01_gdp_chart.html"
docs_path = "./docs_src/charts/gdp_chart.md"

[charts.unemployment_chart]
name = "Unemployment Rate Over Time"
description = "Interactive line chart showing US Unemployment Rate over time."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "Unemployment",
]
frequency = "Monthly"
observation_period = "Month"
release_lag = "One week"
release_timing = "Monthly"
units = "Percent"
path = "./_output/02_unemployment_chart.html"
docs_path = "./docs_src/charts/unemployment_chart.md"

[charts.cpi_inflation_chart]
name = "CPI Inflation"
description = "Line chart showing Consumer Price Index inflation with NBER recession shading and 2% target line."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "Inflation",
    "CPI",
]
frequency = "Monthly"
observation_period = "Month"
release_lag = "Two weeks"
release_timing = "Monthly"
units = "Percent (Year-over-Year)"
path = "./_output/cpi_inflation_chart.html"
docs = """
**Description:** This chart displays the Consumer Price Index (CPI) year-over-year inflation rate, a key measure of price changes in the economy. The chart includes NBER recession shading and a 2% inflation target reference line.

**Relevance for Economic Analysis:** CPI inflation is the primary measure of consumer price changes and is closely watched by the Federal Reserve for monetary policy decisions. The 2% target represents the Fed's inflation goal.

**Direction of Risk:** Persistently high inflation erodes purchasing power and may lead to tighter monetary policy. Very low or negative inflation (deflation) can indicate weak demand and economic stagnation.

**Formulas Used:** Year-over-Year % Change = ((CPI_t - CPI_{t-12}) / CPI_{t-12}) * 100

**Data Cleaning Information:** Data is sourced directly from FRED (CPIAUCSL series) and transformed to year-over-year percentage change.

**What does this add that other charts might not?** Provides context for inflation trends relative to the Fed's target and historical recession periods.
"""

[charts.fedfunds_chart]
name = "Federal Funds Rate"
description = "Area chart showing the Federal Funds Effective Rate over time with NBER recession shading."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "Monetary Policy",
    "Interest Rates",
]
frequency = "Monthly"
observation_period = "Month"
release_lag = "One day"
release_timing = "Daily"
units = "Percent"
path = "./_output/fedfunds_chart.html"
docs = """
**Description:** This chart shows the Federal Funds Effective Rate, the interest rate at which depository institutions lend reserve balances to other depository institutions overnight. NBER recession shading is included for context.

**Relevance for Economic Analysis:** The Federal Funds Rate is the primary tool of US monetary policy. Changes in this rate affect borrowing costs throughout the economy and signal the Fed's stance on economic conditions.

**Direction of Risk:** Rising rates indicate tightening monetary policy to combat inflation, which can slow economic growth. Falling rates indicate easing policy to stimulate the economy.

**Formulas Used:** N/A - Direct observation of the effective rate.

**Data Cleaning Information:** Data is sourced directly from FRED (FEDFUNDS series) without additional transformations.

**What does this add that other charts might not?** Shows the Fed's policy stance over time and its relationship to economic recessions.
"""

[charts.gdp_unemployment_dual_chart]
name = "GDP and Unemployment Rate"
description = "Dual-axis chart with GDP as bars (left axis) and Unemployment Rate as a line (right axis)."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "GDP",
    "Unemployment",
]
frequency = "Quarterly/Monthly"
observation_period = "Quarter/Month"
release_lag = "One month"
release_timing = "Quarterly/Monthly"
units = "Billions of Dollars / Percent"
path = "./_output/gdp_unemployment_dual_chart.html"
docs = """
**Description:** This dual-axis chart combines GDP (shown as bars on the left axis) with the Unemployment Rate (shown as a line on the right axis), allowing visualization of their inverse relationship.

**Relevance for Economic Analysis:** GDP and unemployment are two of the most important macroeconomic indicators. They typically move inversely - when GDP grows, unemployment tends to fall (Okun's Law).

**Direction of Risk:** Falling GDP combined with rising unemployment signals recession risk. Strong GDP growth with low unemployment indicates a healthy economy but may also signal inflation pressures.

**Formulas Used:** N/A - Direct observations of both series.

**Data Cleaning Information:** GDP is quarterly data; Unemployment is monthly data averaged to quarterly for alignment.

**What does this add that other charts might not?** Visualizes the classic inverse relationship between economic output and unemployment in a single view.
"""

[charts.inflation_gdp_scatter]
name = "Inflation vs GDP Growth"
description = "Scatter plot showing the relationship between GDP growth and CPI inflation with regression line."
dataframe = "fred"
tags = [
    "Macroeconomic",
    "GDP",
    "Inflation",
]
frequency = "Quarterly/Monthly"
observation_period = "Year"
release_lag = "One month"
release_timing = "Quarterly"
units = "Percent"
path = "./_output/inflation_gdp_scatter.html"
docs = """
**Description:** This scatter plot examines the relationship between GDP growth and CPI inflation, with a regression line to show the correlation. Each point represents a time period.

**Relevance for Economic Analysis:** Understanding the relationship between growth and inflation is central to macroeconomic policy. The Phillips Curve suggests a trade-off, though this relationship has evolved over time.

**Direction of Risk:** High growth with high inflation may require contractionary policy. Low growth with high inflation (stagflation) is particularly challenging for policymakers.

**Formulas Used:** GDP Growth = ((GDP_t - GDP_{t-4}) / GDP_{t-4}) * 100; Inflation as YoY CPI change.

**Data Cleaning Information:** Both series transformed to year-over-year percentage changes and aligned by date.

**What does this add that other charts might not?** Explores the growth-inflation trade-off directly, which is not visible in time series charts of individual indicators.
"""
