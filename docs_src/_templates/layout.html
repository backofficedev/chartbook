{%- extends "!layout.html" %}
{#- Social cards for link previews on Slack, X, and LinkedIn -#}
{%- block head_tag_end %}
{{ super() }}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title|striptags|e }} · ChartBook">
<meta property="og:description" content="{{ social_description|e }}">
<meta property="og:image" content="{{ social_card }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="{{ social_description|e }}">
{%- endblock %}
