<line x1='554' y1='96.5' x2='674' y2='96.5' stroke='#58a6ff' stroke-width='1.6' marker-end='url(#a)'/>
<rect x='557.9' y='85.5' width='112.2' height='22' rx='11' fill='#1c2a3d'/>
<text x='614.0' y='100.5' text-anchor='middle' fill='#58a6ff' font-size='12' font-family='JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace'>chartbook pin</text>
<path d='M 120 169 Q 450 262 780 169' fill='none' stroke='#f0883e' stroke-width='1.6' stroke-dasharray='6 5' marker-end='url(#w)'/>
<rect x='286.6' y='204.5' width='326.8' height='22' rx='11' fill='#2d1d10'/>
<text x='450.0' y='219.5' text-anchor='middle' fill='#f0883e' font-size='12' font-family='JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace'>never: one pipeline reads another's folder</text>
<text x='450.0' y='268' text-anchor='middle' fill='#9aa7b4' font-size='13'>A newer snapshot moves nothing until you run <tspan font-family='JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace' fill='#58a6ff'>chartbook update</tspan>; a <tspan font-family='JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace' fill='#58a6ff'>git diff</tspan> of the lockfile shows the move.</text>
