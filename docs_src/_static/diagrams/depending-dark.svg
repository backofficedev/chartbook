<rect x='680' y='30' width='200' height='133' rx='12' fill='#161b22' stroke='#30363d' filter='url(#s)'/>
<rect x='731.4' y='42' width='97.2' height='20' rx='10' fill='#1c2a3d'/>
<text x='780.0' y='56' text-anchor='middle' fill='#79b8ff' font-size='11' font-weight='600' letter-spacing='0.04em'>YOUR FOLDER</text>
<text x='780.0' y='84' text-anchor='middle' fill='#e6edf3' font-size='15.5' font-weight='650'>rate_forecast</text>
<text x='780.0' y='103' text-anchor='middle' fill='#9aa7b4' font-size='12.5'>chartbook.lock pins it;</text>
<text x='780.0' y='122' text-anchor='middle' fill='#9aa7b4' font-size='12.5'>data.load() reads the copy</text>
