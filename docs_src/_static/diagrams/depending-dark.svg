<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 280' width='900' height='280' font-family='Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='14'>
