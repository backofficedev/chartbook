<rect x='67.8' y='42' width='104.4' height='20' rx='10' fill='#1c2a3d'/>
<text x='120.0' y='56' text-anchor='middle' fill='#79b8ff' font-size='11' font-weight='600' letter-spacing='0.04em'>THEIR FOLDER</text>
<text x='120.0' y='84' text-anchor='middle' fill='#e6edf3' font-size='15.5' font-weight='650'>fed_yield_curve</text>
<text x='120.0' y='103' text-anchor='middle' fill='#9aa7b4' font-size='12.5'>they build it;</text>
<text x='120.0' y='122' text-anchor='middle' fill='#9aa7b4' font-size='12.5'>it may be mid-change</text>
<rect x='350' y='30' width='200' height='133' rx='12' fill='#161b22' stroke='#30363d' filter='url(#s)'/>
<rect x='397.8' y='42' width='104.4' height='20' rx='10' fill='#12261e'/>
<text x='450.0' y='56' text-anchor='middle' fill='#56d364' font-size='11' font-weight='600' letter-spacing='0.04em'>IN THE STORE</text>
<text x='450.0' y='84' text-anchor='middle' fill='#e6edf3' font-size='15.5' font-weight='650'>snapshot</text>
<text x='450.0' y='105' text-anchor='middle' fill='#58a6ff' font-size='12' font-family='JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace'>4f2a91c · sha256 each</text>
<text x='450.0' y='124' text-anchor='middle' fill='#9aa7b4' font-size='12.5'>what they built at that</text>
