<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 250' width='820' height='250' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='14'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#93c5fd'/></marker></defs>
<rect x='20' y='24' width='180' height='122' rx='8' fill='#1f2937' stroke='#93c5fd' stroke-width='1.5'/>
<text x='110.0' y='50' text-anchor='middle' fill='#e5e7eb' font-size='15' font-weight='600'>manifest</text>
<text x='110.0' y='70' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>chartbook.toml</text>
<text x='110.0' y='88' text-anchor='middle' fill='#9ca3af' font-size='12.5'>asks:</text>
<text x='110.0' y='106' text-anchor='middle' fill='#9ca3af' font-size='12.5'>which assets, where,</text>
<text x='110.0' y='124' text-anchor='middle' fill='#9ca3af' font-size='12.5'>what it depends on</text>
<text x='110.0' y='168' text-anchor='middle' fill='#9ca3af' font-size='11.5'>written by</text>
<text x='110.0' y='186' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>people</text>
<text x='110.0' y='240' text-anchor='middle' fill='#9ca3af' font-size='12.5'>in git</text>
<rect x='220' y='24' width='180' height='122' rx='8' fill='#1f2937' stroke='#93c5fd' stroke-width='1.5'/>
<text x='310.0' y='50' text-anchor='middle' fill='#e5e7eb' font-size='15' font-weight='600'>lockfile</text>
<text x='310.0' y='70' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>chartbook.lock</text>
<text x='310.0' y='88' text-anchor='middle' fill='#9ca3af' font-size='12.5'>records what was got:</text>
<text x='310.0' y='106' text-anchor='middle' fill='#9ca3af' font-size='12.5'>which snapshot each</text>
<text x='310.0' y='124' text-anchor='middle' fill='#9ca3af' font-size='12.5'>dependency is pinned to</text>
<text x='310.0' y='168' text-anchor='middle' fill='#9ca3af' font-size='11.5'>written by</text>
<text x='310.0' y='186' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>chartbook pin, update</text>
<text x='310.0' y='203' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>(run, for a first pin)</text>
<text x='310.0' y='240' text-anchor='middle' fill='#9ca3af' font-size='12.5'>in git, no timestamp</text>
<rect x='420' y='24' width='180' height='122' rx='8' fill='#1f2937' stroke='#93c5fd' stroke-width='1.5'/>
<text x='510.0' y='50' text-anchor='middle' fill='#e5e7eb' font-size='15' font-weight='600'>snapshot</text>
<text x='510.0' y='70' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>store/snapshots/…</text>
<text x='510.0' y='88' text-anchor='middle' fill='#9ca3af' font-size='12.5'>records what was made:</text>
<text x='510.0' y='106' text-anchor='middle' fill='#9ca3af' font-size='12.5'>every asset built at one</text>
<text x='510.0' y='124' text-anchor='middle' fill='#9ca3af' font-size='12.5'>commit, with its hash</text>
<text x='510.0' y='168' text-anchor='middle' fill='#9ca3af' font-size='11.5'>written by</text>
<text x='510.0' y='186' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>chartbook snapshot</text>
<text x='510.0' y='203' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>or run --snapshot</text>
<text x='510.0' y='240' text-anchor='middle' fill='#9ca3af' font-size='12.5'>in the store, not in git</text>
<rect x='620' y='24' width='180' height='122' rx='8' fill='#1f2937' stroke='#93c5fd' stroke-width='1.5'/>
<text x='710.0' y='50' text-anchor='middle' fill='#e5e7eb' font-size='15' font-weight='600'>index</text>
<text x='710.0' y='70' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>index.json</text>
<text x='710.0' y='88' text-anchor='middle' fill='#9ca3af' font-size='12.5'>records what a site shows:</text>
<text x='710.0' y='106' text-anchor='middle' fill='#9ca3af' font-size='12.5'>every record of every</text>
<text x='710.0' y='124' text-anchor='middle' fill='#9ca3af' font-size='12.5'>pipeline, pins reported</text>
<text x='710.0' y='168' text-anchor='middle' fill='#9ca3af' font-size='11.5'>written by</text>
<text x='710.0' y='186' text-anchor='middle' fill='#60a5fa' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>chartbook docs, build</text>
<text x='710.0' y='240' text-anchor='middle' fill='#9ca3af' font-size='12.5'>beside the site</text>
</svg>
