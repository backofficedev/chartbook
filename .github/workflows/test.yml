name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure does not cancel the other's run
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Windows on the oldest and newest Python: its runners are slower
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The uv that wrote uv.lock, so that --locked below judges the lock as it
    # was written; bump both together (`uv self update`, `uv lock`, this pin)
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.6.6"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # The environment uv.lock describes, resolved for this Python; a stale
    # lock fails here rather than quietly installing something else
    - name: Install the project and its dev group
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest -v -rfE
