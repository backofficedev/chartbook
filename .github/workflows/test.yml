name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # The environment uv.lock describes, resolved for this Python; a stale
    # lock fails here rather than quietly installing something else
    - name: Install the project and its dev group
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest -v
