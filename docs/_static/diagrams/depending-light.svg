<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 300' width='820' height='300' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif' font-size='14'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#2b4c7e'/></marker></defs>
<rect x='20' y='40' width='200' height='110' rx='8' fill='#f4f7fb' stroke='#2b4c7e' stroke-width='1.5'/>
<text x='120.0' y='66' text-anchor='middle' fill='#1f2937' font-size='15' font-weight='600'>fed_yield_curve</text>
<text x='120.0' y='86' text-anchor='middle' fill='#2b6cb0' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>their folder</text>
<text x='120.0' y='104' text-anchor='middle' fill='#4b5563' font-size='12.5'>they build it;</text>
<text x='120.0' y='122' text-anchor='middle' fill='#4b5563' font-size='12.5'>it may be mid-change</text>
<rect x='310' y='40' width='200' height='110' rx='8' fill='#f4f7fb' stroke='#2b4c7e' stroke-width='1.5'/>
<text x='410.0' y='66' text-anchor='middle' fill='#1f2937' font-size='15' font-weight='600'>snapshot</text>
<text x='410.0' y='86' text-anchor='middle' fill='#2b6cb0' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>snapshots/4f2a91c…/…</text>
<text x='410.0' y='104' text-anchor='middle' fill='#4b5563' font-size='12.5'>what they built at that</text>
<text x='410.0' y='122' text-anchor='middle' fill='#4b5563' font-size='12.5'>commit, declared ready</text>
<rect x='600' y='40' width='200' height='110' rx='8' fill='#f4f7fb' stroke='#2b4c7e' stroke-width='1.5'/>
<text x='700.0' y='66' text-anchor='middle' fill='#1f2937' font-size='15' font-weight='600'>rate_forecast</text>
<text x='700.0' y='86' text-anchor='middle' fill='#2b6cb0' font-size='12.5' font-family='SFMono-Regular, Menlo, Consolas, monospace'>your folder</text>
<text x='700.0' y='104' text-anchor='middle' fill='#4b5563' font-size='12.5'>chartbook.lock pins it;</text>
<text x='700.0' y='122' text-anchor='middle' fill='#4b5563' font-size='12.5'>data.load() reads the copy</text>
<line x1='224' y1='95.0' x2='306' y2='95.0' stroke='#2b4c7e' stroke-width='1.5' marker-end='url(#a)'/>
<text x='265.0' y='113.0' text-anchor='middle' fill='#4b5563' font-size='12.5' font-style='italic'>chartbook run</text>
<text x='265.0' y='128.0' text-anchor='middle' fill='#4b5563' font-size='12.5' font-style='italic'>--snapshot</text>
<line x1='514' y1='95.0' x2='596' y2='95.0' stroke='#2b4c7e' stroke-width='1.5' marker-end='url(#a)'/>
<text x='555.0' y='113.0' text-anchor='middle' fill='#4b5563' font-size='12.5' font-style='italic'>chartbook pin</text>
<path d='M 120 154 C 120 232, 700 232, 700 154' fill='none' stroke='#b45309' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#a)'/>
<text x='410' y='252' text-anchor='middle' fill='#b45309' font-size='12.5' font-style='italic'>never: a pipeline does not read another's folder</text>
<text x='410.0' y='278' text-anchor='middle' fill='#4b5563' font-size='13'>a newer snapshot moves nothing until you say <tspan font-family='SFMono-Regular, Menlo, Consolas, monospace' fill='#2b6cb0'>chartbook update</tspan>; a <tspan font-family='SFMono-Regular, Menlo, Consolas, monospace' fill='#2b6cb0'>git diff</tspan> of the lockfile shows the move</text>
</svg>
